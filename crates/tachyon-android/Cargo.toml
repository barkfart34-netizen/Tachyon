[package]
name = "tachyon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tachyon Android native library (cdylib) without horizon-client dev-dependencies"
autobins = false
autoexamples = false
autotests = false

[lib]
name = "tachyon"
path = "../horizon-client/src/android_main.rs"
crate-type = ["cdylib"]

[dependencies]
# Dedicated crate so Cargo never unifies horizon-client's [dev-dependencies]
# (e.g. horizon-mod-vocab/testing, which scopes MODS/INSTALLED to a single thread).
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio", "android"] }
horizon-core = { path = "../horizon-core" }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index", "runtime-process"] }
horizon-port-pack = { path = "../horizon-port-pack" }
horizon-theme = { path = "../horizon-theme" }
ab_glyph = "0.2.32"
bytemuck = { version = "1.24", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
log = "0.4"
png = "0.18"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "gles", "wgsl", "naga-ir"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.22.4"
ndk-context = "0.1.1"
libc = "0.2"

[lints]
workspace = true
