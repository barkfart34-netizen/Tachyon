# Tachyon in the Android emulator: an x86_64 build of the same APK, started
# with smoke-args.txt so it opens a creative world by itself (.github/tachyon/
# smoke.sh). Run by hand: it costs a build of its own.
name: Tachyon emulator test

on:
  workflow_dispatch:

concurrency:
  group: tachyon-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: bash .github/tachyon/free-disk.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: tachyon-smoke
          cache-on-failure: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Cached resources
        id: resources
        uses: actions/cache/restore@v4
        with:
          path: .tachyon/resources
          key: resources-26.3-${{ hashFiles('research-lock.json', 'crates/horizon-prepare/**', 'mods/horizon/src/test/java/dev/horizonlab/parity/**') }}

      - name: Prepare the resources from Minecraft 26.3
        if: steps.resources.outputs.cache-hit != 'true'
        run: bash .github/tachyon/prepare.sh "$PWD/.tachyon/resources"

      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build the x86_64 APK
        env:
          TACHYON_RESOURCES: ${{ github.workspace }}/.tachyon/resources
          TACHYON_TARGET: x86_64-linux-android
          TACHYON_VERSION_CODE: ${{ github.run_number }}
        run: |
          bash android/build-apk.sh
          # The resources are in the APK now: room for the emulator.
          rm -rf .tachyon target/x86_64-linux-android/android/deps target/x86_64-linux-android/android/build
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/tachyon/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tachyon-smoke
          path: smoke/
          retention-days: 3
