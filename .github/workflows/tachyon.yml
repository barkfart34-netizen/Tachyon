# Tachyon's Android APK: prepares Minecraft 26.3's resources (once per
# version of the preparation, then from the cache), builds the game for arm64,
# packs both into the APK and publishes it as a release of this private
# repository. Horizon's own workflows are not part of Tachyon.
name: Tachyon APK

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "roadmap/**", "tests/**", "tools/**"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile: android (quick to build) or release (LTO, faster game)"
        default: android
        type: choice
        options: [android, release]

permissions:
  contents: write

concurrency:
  group: tachyon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PROFILE: ${{ inputs.profile || 'android' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: bash .github/tachyon/free-disk.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: tachyon-${{ inputs.profile || 'android' }}
          cache-on-failure: true

      # Java 25 runs horizon-prepare's exporters; Gradle runs on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Cached resources
        id: resources
        uses: actions/cache/restore@v4
        with:
          path: .tachyon/resources
          key: resources-26.3-${{ hashFiles('research-lock.json', 'crates/horizon-prepare/**', 'mods/horizon/src/test/java/dev/horizonlab/parity/**') }}

      - name: Prepare the resources from Minecraft 26.3
        if: steps.resources.outputs.cache-hit != 'true'
        run: bash .github/tachyon/prepare.sh "$PWD/.tachyon/resources"

      # Saved at once, so a failed or cancelled build later keeps them.
      - name: Save the resources
        if: steps.resources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tachyon/resources
          key: ${{ steps.resources.outputs.cache-primary-key }}

      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.TACHYON_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tachyon.keystore"
            echo "TACHYON_KEYSTORE=$RUNNER_TEMP/tachyon.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          TACHYON_RESOURCES: ${{ github.workspace }}/.tachyon/resources
          TACHYON_PROFILE: ${{ env.PROFILE }}
          TACHYON_VERSION_CODE: ${{ github.run_number }}
          TACHYON_KEYSTORE_PASSWORD: ${{ secrets.TACHYON_KEYSTORE_PASSWORD }}
        run: bash android/build-apk.sh

      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "tachyon-${{ github.run_number }}" android/build/Tachyon.apk
          --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest
          --title "Tachyon #${{ github.run_number }}"
          --notes "Tachyon untuk Android (arm64, Android 10+, Vulkan), profil ${{ env.PROFILE }}, dari commit ${{ github.sha }}. Resource Minecraft 26.3 sudah di dalam APK: pasang, buka, tunggu bongkar resource sekali (sekitar 1 menit), lalu Play. Untuk pribadi, jangan dibagikan."
