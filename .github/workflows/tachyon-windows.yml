# Tachyon for Windows: the launcher and the game in Tachyon.exe, with
# Minecraft 26.3's prepared resources beside it in one zip, published as a
# release of this private repository. Windows minutes cost twice Linux ones:
# it runs when the desktop's own code changes, or by hand.
name: Tachyon Windows

on:
  push:
    branches: [main]
    paths:
      - "crates/horizon-client/src/desktop/**"
      - "crates/horizon-client/src/tachyon/**"
      - "crates/horizon-client/src/tachyon_main.rs"
      - "crates/horizon-client/src/game/tachyon_mods.rs"
      - "crates/horizon-client/src/game/tachyon_mods/**"
      - "crates/horizon-client/src/game/tachyon_engine.rs"
      - "crates/horizon-client/src/game/tachyon_engine/**"
      - "crates/horizon-client/src/game/mods.rs"
      - "crates/horizon-client/src/mod_content.rs"
      - ".github/tachyon/scene.py"
      - "tachyon/**"
      - ".github/workflows/tachyon-windows.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile: tachyon (thin LTO, the releases'), fast (quick to build) or release"
        default: tachyon
        type: choice
        options: [tachyon, fast, release]

permissions:
  contents: write

concurrency:
  group: tachyon-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The resources in a cache Windows can read (a cross-OS archive), from the
  # APK workflow's cache when it has them, else prepared here on Linux.
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      key: xos-resources-26.3-${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      # Hashed here: a Windows checkout has other line endings, and another hash.
      - name: The preparation's version
        id: hash
        run: echo "hash=${{ hashFiles('research-lock.json', 'crates/horizon-prepare/**', 'mods/horizon/src/test/java/dev/horizonlab/parity/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cached for Windows
        id: windows
        uses: actions/cache/restore@v4
        with:
          path: .tachyon/resources
          key: xos-resources-26.3-${{ steps.hash.outputs.hash }}
          enableCrossOsArchive: true
          lookup-only: true

      - name: Cached for the APK
        id: linux
        if: steps.windows.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tachyon/resources
          key: resources-26.3-${{ steps.hash.outputs.hash }}

      - name: Free disk space
        if: steps.windows.outputs.cache-hit != 'true' && steps.linux.outputs.cache-hit != 'true'
        run: bash .github/tachyon/free-disk.sh

      - uses: dtolnay/rust-toolchain@stable
        if: steps.windows.outputs.cache-hit != 'true' && steps.linux.outputs.cache-hit != 'true'

      - uses: actions/setup-java@v4
        if: steps.windows.outputs.cache-hit != 'true' && steps.linux.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare the resources from Minecraft 26.3
        if: steps.windows.outputs.cache-hit != 'true' && steps.linux.outputs.cache-hit != 'true'
        run: bash .github/tachyon/prepare.sh "$PWD/.tachyon/resources"

      - name: Save them for Windows
        if: steps.windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tachyon/resources
          key: xos-resources-26.3-${{ steps.hash.outputs.hash }}
          enableCrossOsArchive: true

  windows:
    needs: resources
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PROFILE: ${{ inputs.profile || 'tachyon' }}
      # No DLL a player's Windows may lack (the C runtime), as Horizon's releases.
      RUSTFLAGS: -C target-feature=+crt-static
      TACHYON_BUILD: windows-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: tachyon-windows-${{ inputs.profile || 'tachyon' }}
          cache-on-failure: true

      - name: Build Tachyon.exe
        run: cargo build -p horizon-client --bin tachyon-desktop --profile ${{ env.PROFILE }}

      - name: Resources
        uses: actions/cache/restore@v4
        with:
          path: .tachyon/resources
          key: ${{ needs.resources.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Pack the zip
        shell: bash
        run: |
          dir=dist/Tachyon
          mkdir -p "$dir"
          cp "target/$PROFILE/tachyon-desktop.exe" "$dir/Tachyon.exe"
          mv .tachyon/resources/horizon-client/26.3 "$dir/resources"
          # The modpack's own content mods, always on (brand::CONTENT).
          cp -r tachyon/content "$dir/resources/tachyon-mods"
          cat > "$dir/README.txt" <<'EOF'
          Tachyon for Windows: Minecraft: Java Edition 26.3, native, built on Horizon (Rust).

          Start Tachyon.exe, add an offline account (a name) and press PLAY.
          Keep the resources folder next to Tachyon.exe. Worlds, options and logs are in
          %APPDATA%\.tachyon (each installation has its own folder there).

          For personal use only: do not share. Not an official Minecraft product; not
          approved by or associated with Mojang or Microsoft.
          EOF
          cd dist && 7z a -tzip -mx=5 Tachyon-windows.zip Tachyon > /dev/null
          ls -la Tachyon-windows.zip

      # Pictures of the launcher's pages (on Windows' software renderer), to
      # look at without a Windows PC: the artifact tachyon-launcher.
      - name: Pictures of the launcher
        shell: bash
        env:
          TACHYON_SNAPSHOTS: ${{ github.workspace }}/snapshots
        run: |
          timeout 180 dist/Tachyon/Tachyon.exe || echo "the launcher ended with $?"
          ls -la snapshots || true
          tail -20 "$APPDATA/.tachyon/logs/latest.log" || true

      # The game itself from Tachyon.exe, also on the software renderer: a new
      # creative world for a few frames, with its report and log in the artifact.
      - name: The game starts
        shell: bash
        continue-on-error: true
        run: |
          home="$RUNNER_TEMP/game"
          mkdir -p "$home" snapshots
          cd "$home"
          export TACHYON_GAME=1 HORIZON_HOME="$home" HORIZON_NO_HEARTBEAT=1 HORIZON_NO_DISCORD=1
          args=(--world Smoke --creative --seed 5 --render-distance 4 --world-frames 20)
          timeout 600 "$GITHUB_WORKSPACE/dist/Tachyon/Tachyon.exe" "${args[@]}" \
            --smoke-report "$home/report.json" || echo "the game ended with $?"
          cat "$home/report.json" || true
          tail -40 "$home/logs/latest.log" || true
          cp "$home/report.json" "$home/logs/latest.log" "$GITHUB_WORKSPACE/snapshots/" || true

      # The built-in mods in a world, through the game's control socket: the
      # Minimap and Coordinates HUD in a picture, /where in chat, and their
      # rows in Options > Mods (scene.py).
      - name: The built-in mods in a world
        shell: bash
        continue-on-error: true
        run: |
          code=0
          exe="$GITHUB_WORKSPACE/dist/Tachyon/Tachyon.exe"
          timeout 1500 python .github/tachyon/scene.py "$exe" "$RUNNER_TEMP/scene" "$GITHUB_WORKSPACE/snapshots/scene" || code=$?
          tail -30 "$RUNNER_TEMP/scene/logs/latest.log" || true
          cp "$RUNNER_TEMP/scene/logs/latest.log" "$GITHUB_WORKSPACE/snapshots/scene/" || true
          exit $code

      # A Java mod (Create, from Modrinth) through the import a dropped file
      # runs, then the game with its content on. Only logs leave the runner:
      # the ported mod's assets are its authors'.
      - name: A Java mod imported, and the game with it
        shell: bash
        continue-on-error: true
        run: |
          home="$RUNNER_TEMP/modded"
          mkdir -p "$home" snapshots
          versions='https://api.modrinth.com/v2/project/create/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D'
          url=$(curl -fsSL "$versions" | python -c "import json,sys; v=json.load(sys.stdin); m=[x for x in v if '6.0.10' in x['version_number']] or v; print(m[0]['files'][0]['url'])")
          curl -fsSL -o "$RUNNER_TEMP/create.jar" "$url"
          TACHYON_IMPORT="$RUNNER_TEMP/create.jar" HORIZON_HOME="$home" dist/Tachyon/Tachyon.exe && echo "imported" || echo "the import failed: $?"
          cat "$home/tachyon-import.txt" || true
          echo
          cat "$home/horizon-mods.txt" || true
          cd "$home"
          export TACHYON_GAME=1 HORIZON_HOME="$home" HORIZON_NO_HEARTBEAT=1 HORIZON_NO_DISCORD=1
          args=(--world Modded --creative --seed 5 --render-distance 4 --world-frames 20)
          timeout 900 "$GITHUB_WORKSPACE/dist/Tachyon/Tachyon.exe" "${args[@]}" \
            --smoke-report "$home/report.json" || echo "the game ended with $?"
          cat "$home/report.json" || true
          grep -i "mod\|content\|warn\|error\|panic" "$home/logs/latest.log" | head -80 || true
          cp "$home/logs/latest.log" "$GITHUB_WORKSPACE/snapshots/modded-game.log" || true
          cp "$home/report.json" "$GITHUB_WORKSPACE/snapshots/modded-report.json" || true
          cp "$home/tachyon-import.txt" "$GITHUB_WORKSPACE/snapshots/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tachyon-launcher
          path: snapshots
          retention-days: 7
          if-no-files-found: warn

      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "tachyon-windows-${{ github.run_number }}" dist/Tachyon-windows.zip
          --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false
          --title "Tachyon for Windows #${{ github.run_number }}"
          --notes "Tachyon untuk Windows (x64, DirectX 12 / Vulkan), profil ${{ env.PROFILE }}, dari commit ${{ github.sha }}. Ekstrak zip, jalankan Tachyon.exe, tambahkan akun offline (cukup nama), lalu PLAY. Folder resources harus tetap di samping Tachyon.exe. Untuk pribadi, jangan dibagikan."
