# Tachyon's own code checked and tested on Linux, the cheapest runner: the
# desktop program's build, and the tests of Tachyon's parts (the launchers'
# store and import, the built-in mods, the hook points). The APK and Windows
# workflows build the releases.
name: Tachyon check

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tachyon-check.yml"
  workflow_dispatch:

concurrency:
  group: tachyon-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: bash .github/tachyon/free-disk.sh

      - name: The ALSA and udev headers the client links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: tachyon-check
          cache-on-failure: true

      # The game (its Tachyon engine, the native hooks) is in the library; the
      # launchers in the programs.
      - name: Tachyon's tests
        run: |
          cargo test -p horizon-client --lib -- tachyon native_hooks
          cargo test -p horizon-client --bin tachyon-desktop -- tachyon desktop

      - name: The import's Java mod port
        run: cargo test -p horizon-port-pack

      - name: Content mods in the resource root (features beside vanilla's) and the creative tabs
        run: cargo test -p horizon-client-lib --lib -- mod_content creative

      # The touch controls' Android side compiles only for Android: checked
      # (not linked) with the NDK's compilers for the C parts, as the APK builds.
      - name: The Android build compiles
        if: ${{ !cancelled() }}
        run: |
          rustup target add aarch64-linux-android
          llvm="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$llvm/aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="$llvm/aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="$llvm/llvm-ar"
          cargo check -p horizon-client --example tachyon --target aarch64-linux-android \
              --no-default-features --features audio,android
