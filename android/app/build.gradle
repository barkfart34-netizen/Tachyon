plugins {
    id 'com.android.application'
}

// android/build-apk.sh fills these: the game's library and the assets (the
// prepared resources and their id).
def staged = rootProject.file('build/stage')

android {
    namespace 'com.tachyon.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tachyon.game'
        minSdk 29
        targetSdk 36
        versionCode Integer.parseInt(project.findProperty('tachyonVersionCode') ?: '1')
        versionName project.findProperty('tachyonVersionName') ?: '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["$staged/jniLibs"]
            assets.srcDirs = ["$staged/assets"]
        }
    }

    signingConfigs {
        release {
            def keystore = System.getenv('TACHYON_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('TACHYON_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TACHYON_KEY_ALIAS') ?: 'tachyon'
                keyPassword System.getenv('TACHYON_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig System.getenv('TACHYON_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // Stripped by build-apk.sh already.
            keepDebugSymbols += '**/*.so'
        }
    }

    androidResources {
        // The resources are a zip already, stored so the app reads it in place.
        noCompress += ['zip']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
